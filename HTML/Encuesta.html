<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Encuesta - Punto Escolar</title>
    <link rel="stylesheet" href="../CSS/GlobalStyless.css">
    <link rel="stylesheet" href="../CSS/IndexStyless.css"> 
    <link rel="stylesheet" href="../CSS/EncuestaStyles.css">   
    <link rel="icon" href="../Images/logo/logo4.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <img src="../Images/logo/logo4.png" alt="Logo">
        </div>       

        <!-- MENU HORIZONTAL -->
        <nav class="menu">
            <ul>
                <li><a href="../HTML/CategoriaCuadernos.html">Cuadernos</a></li>
                <li><a href="../HTML/CategoriaLapices.html">Lápices</a></li>
                <li><a href="../HTML/CategoriaLapiceras.html">Lapiceras</a></li>
                <li><a href="../HTML/CategoriaFibras.html">Fibras</a></li>
                <li><a href="../HTML/CategoriaBorradores.html">Borradores</a></li>
                <li><a href="../HTML/CategoriaMochilas.html">Mochilas</a></li>
                <li><a href="../HTML/CategoriaCartucheras.html">Cartucheras</a></li>
                <li><a href="../HTML/CategoriaPapeleria.html">Papelería</a></li>
                <li><a href="../HTML/Encuesta.html"class="active">Encuesta</a></li>
            </ul>
        </nav>

        <!-- ICONOS -->
        <div class="home">
            <a href="../HTML/index.html">
                <i class="fas fa-home"></i>
            </a>
            <a href="../HTML/CarritoDeCompras.html">
                <i class="fas fa-shopping-cart"></i>
            </a>
        </div>

    </header>

    <div class="container">
        
        <main class="contenido">
            <h2>Encuesta</h2>            
                
            <form class="formulario">

            <label>Nombre:</label>
            <input type="text" name="nombre">

            <label>Apellido:</label>
            <input type="text" name="apellido">

            <label>Fecha de nacimiento:</label>
            <input type="date" name="fecha">

            <label>Sexo:</label>
            <select name="sexo">
                <option value="">Seleccione</option>
                <option>Masculino</option>
                <option>Femenino</option>
            </select>

            <label>Valoración:</label>
            <div class="radio-group">
                <label><input type="radio" name="valoracion"> Lamentable</label>
                <label><input type="radio" name="valoracion"> Mala</label>
                <label><input type="radio" name="valoracion"> Podría ser mejor</label>
                <label><input type="radio" name="valoracion"> Cumple</label>
                <label><input type="radio" name="valoracion"> Me encantó</label>
            </div>

            <label>Email:</label>
            <input type="text" name="email">

            <label>Comentario:</label>
            <textarea name="comentario"></textarea>

            <div class="botones">
                <button type="submit">Enviar</button>
                <button type="button">Cancelar</button>
                <button type="reset">Restablecer</button>
            </div>

        </form>

        </main>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 - Punto Escolar | Desarrollado por Melina Cora</p>
    </footer>
    <script src="../JS/Validaciones.js"></script>
</body>
</html>
